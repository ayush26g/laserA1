<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Laser Diode Characterization Lab</title>

  <link rel="stylesheet" href="css/main.css">

  <!-- Stable A-Frame VR Framework (Self-contained, No flaky external extras) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- Physics & VR Interaction Engine -->
  <script src="js/main.js" defer></script>
</head>
<body>

  <!-- Desktop navigation guide -->
  <div class="guide-box">
    <div style="font-weight: bold; color: #38bdf8; font-size: 14px;">🔬 LASER DIODE OPTICS LAB</div>
    • <strong>Walk (Desktop):</strong> <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd><br>
    • <strong>Walk (VR Headset):</strong> Left Controller Thumbstick<br>
    • <strong>Look / Turn:</strong> Mouse Drag / Right VR Stick<br>
    • <strong>Interact:</strong> Click table buttons (<span style="color:#10b981;">+5mA</span>, <span style="color:#38bdf8;">+1mA</span>, <span style="color:#ef4444;">-5mA</span>)
  </div>

  <!-- Real-time 2D Canvases rendered onto VR 3D Monitors and Signs -->
  <div class="offscreen-canvas-container">
    <canvas id="liChartCanvas" width="512" height="384"></canvas>
    <canvas id="specChartCanvas" width="512" height="384"></canvas>
    <canvas id="dangerSignCanvas" width="512" height="360"></canvas>
    <canvas id="theoryCanvas" width="768" height="860"></canvas>
  </div>

  <a-scene xr-mode-ui="XRMode: xr" renderer="antialias: true; colorManagement: true;">

    <!-- ============================================== -->
    <!-- 1. LIGHTING                                    -->
    <!-- ============================================== -->
    <a-entity light="type: ambient; color: #94a3b8; intensity: 0.9"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.9" position="2 4 1"></a-entity>
    <a-entity light="type: point; color: #38bdf8; intensity: 0.8; distance: 5" position="0 2 -1.4"></a-entity>

    <!-- ============================================== -->
    <!-- 2. LAB ROOM ENCLOSURE                          -->
    <!-- ============================================== -->
    <!-- Tiled Floor -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="12" height="12" color="#1e293b" roughness="0.5"></a-plane>
    <!-- Dark Lab Ceiling -->
    <a-plane position="0 3.6 0" rotation="90 0 0" width="12" height="12" color="#090d16"></a-plane>

    <!-- Overhead Fluorescent Lighting Bars -->
    <a-box position="0 3.55 -1.2" width="0.35" height="0.06" depth="3.6" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 1"></a-box>
    <a-box position="-2.8 3.55 -1.2" width="0.35" height="0.06" depth="3.6" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 0.8"></a-box>
    <a-box position="2.8 3.55 -1.2" width="0.35" height="0.06" depth="3.6" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 0.8"></a-box>

    <!-- Lab Walls -->
    <a-box position="0 1.8 -5.5" width="12" height="3.6" depth="0.1" color="#18202f"></a-box> <!-- North -->
    <a-box position="0 1.8 5.5" width="12" height="3.6" depth="0.1" color="#18202f"></a-box>  <!-- South -->
    <a-box position="-5.5 1.8 0" width="0.1" height="3.6" depth="12" color="#121824"></a-box> <!-- West -->
    <a-box position="5.5 1.8 0" width="0.1" height="3.6" depth="12" color="#121824"></a-box>  <!-- East -->

    <!-- Baseboards -->
    <a-box position="0 0.25 -5.44" width="12" height="0.5" depth="0.05" color="#0a0e17"></a-box>

    <!-- ============================================== -->
    <!-- 3. REALISTIC ANSI LASER DANGER SIGN            -->
    <!-- ============================================== -->
    <a-entity position="0 2.5 -5.42">
      <a-box width="1.44" height="1.02" depth="0.02" color="#000000"></a-box>
      <a-plane id="danger-sign-mesh" position="0 0 0.012" width="1.4" height="0.98" material="src: #dangerSignCanvas; shader: flat;"></a-plane>
    </a-entity>
    <!-- Side Workbench & Auxiliary Gear -->
    <a-box position="4 0.45 -1.4" width="1.2" height="0.9" depth="3.2" color="#334155" roughness="0.5"></a-box>
    <a-box position="4 0.98 -1.8" width="0.45" height="0.22" depth="0.3" color="#0f172a">
      <a-plane position="-0.09 0.02 0.152" width="0.2" height="0.12" color="#0284c7"></a-plane>
    </a-box>
    <a-box position="4 0.96 -1.1" width="0.35" height="0.18" depth="0.25" color="#475569"></a-box>

    <!-- ============================================== -->
    <!-- 4. CENTRAL OPTICAL BREADBOARD SETUP            -->
    <!-- ============================================== -->
    <a-entity position="0 0 -1.35">
      <!-- Optical Breadboard Top & Legs -->
      <a-box position="0 0.85 0" width="2.5" height="0.08" depth="1.2" color="#0f172a" metalness="0.7" roughness="0.3"></a-box>
      <a-cylinder position="-1.1 0.42 -0.48" radius="0.05" height="0.85" color="#050811"></a-cylinder>
      <a-cylinder position="1.1 0.42 -0.48" radius="0.05" height="0.85" color="#050811"></a-cylinder>
      <a-cylinder position="-1.1 0.42 0.48" radius="0.05" height="0.85" color="#050811"></a-cylinder>
      <a-cylinder position="1.1 0.42 0.48" radius="0.05" height="0.85" color="#050811"></a-cylinder>

      <!-- Laser Diode Constant Current Driver Unit -->
      <a-box position="-0.75 1.05 -0.2" width="0.46" height="0.26" depth="0.3" color="#334155">
        <a-text value="LD CONTROLLER" position="-0.2 0.09 0.155" width="0.75" color="#cbd5e1"></a-text>
        <a-plane position="0 0.01 0.155" width="0.4" height="0.11" color="#020617">
          <a-text id="lcd-display" value="I: 0.0 mA\nP: 0.00 mW" position="-0.17 0 0.01" width="0.9" color="#22c55e"></a-text>
        </a-plane>
      </a-box>

      <!-- Optical Rail -->
      <a-box position="0.1 0.905 0" width="1.25" height="0.02" depth="0.08" color="#475569" metalness="0.8"></a-box>

      <!-- Laser Diode Mount -->
      <a-cylinder position="-0.35 0.96 0" radius="0.018" height="0.12" color="#94a3b8" metalness="0.8"></a-cylinder>
      <a-cylinder position="-0.35 1.03 0" radius="0.04" height="0.14" rotation="0 0 90" color="#334155"></a-cylinder>
      <a-circle position="-0.279 1.03 0" radius="0.012" rotation="0 90 0" color="#000000"></a-circle>

      <!-- Collimating Lens -->
      <a-cylinder position="-0.05 0.96 0" radius="0.018" height="0.12" color="#94a3b8" metalness="0.8"></a-cylinder>
      <a-torus position="-0.05 1.03 0" radius="0.035" radius-tubular="0.006" rotation="0 90 0" color="#1e293b"></a-torus>
      <a-circle position="-0.05 1.03 0" radius="0.029" rotation="0 90 0" color="#93c5fd" opacity="0.4" transparent="true"></a-circle>

      <!-- Photodetector Sensor -->
      <a-cylinder position="0.55 0.96 0" radius="0.018" height="0.12" color="#94a3b8" metalness="0.8"></a-cylinder>
      <a-cylinder position="0.55 1.03 0" radius="0.045" height="0.14" rotation="0 0 90" color="#334155"></a-cylinder>
      <a-circle position="0.479 1.03 0" radius="0.03" rotation="0 -90 0" color="#050811"></a-circle>

      <!-- Red Laser Beam -->
      <a-cylinder id="laser-beam" position="0.1 1.03 0" rotation="0 0 90" radius="0.003" height="0.75" color="#ef4444" material="shader: flat; opacity: 0.0; transparent: true"></a-cylinder>

      <!-- 3D Monitor 1: L-I Curve -->
      <a-entity position="-0.45 1.48 -0.32" rotation="10 12 0">
        <a-box width="0.66" height="0.48" depth="0.02" color="#1e293b"></a-box>
        <a-plane id="li-screen" position="0 0 0.012" width="0.62" height="0.44" material="src: #liChartCanvas; shader: flat;"></a-plane>
      </a-entity>

      <!-- 3D Monitor 2: Optical Spectrum -->
      <a-entity position="0.38 1.48 -0.32" rotation="10 -12 0">
        <a-box width="0.66" height="0.48" depth="0.02" color="#1e293b"></a-box>
        <a-plane id="spec-screen" position="0 0 0.012" width="0.62" height="0.44" material="src: #specChartCanvas; shader: flat;"></a-plane>
      </a-entity>
      <!-- Interactive 3D Buttons on Table Edge -->
      <a-entity position="0 0.96 0.42">
        <!-- -5 mA -->
        <a-box id="btn-decrease" class="clickable" position="-0.24 0 0" width="0.13" height="0.045" depth="0.08" color="#ef4444">
          <a-text value="- 5 mA" align="center" position="0 0.026 0" rotation="-90 0 0" width="0.85" color="#ffffff"></a-text>
        </a-box>
        <!-- +1 mA -->
        <a-box id="btn-step-fine" class="clickable" position="-0.08 0 0" width="0.13" height="0.045" depth="0.08" color="#0284c7">
          <a-text value="+ 1 mA" align="center" position="0 0.026 0" rotation="-90 0 0" width="0.85" color="#ffffff"></a-text>
        </a-box>
        <!-- +5 mA -->
        <a-box id="btn-increase" class="clickable" position="0.08 0 0" width="0.13" height="0.045" depth="0.08" color="#10b981">
          <a-text value="+ 5 mA" align="center" position="0 0.026 0" rotation="-90 0 0" width="0.85" color="#ffffff"></a-text>
        </a-box>
        <!-- RESET -->
        <a-box id="btn-reset" class="clickable" position="0.24 0 0" width="0.11" height="0.045" depth="0.08" color="#64748b">
          <a-text value="RESET" align="center" position="0 0.026 0" rotation="-90 0 0" width="0.75" color="#ffffff"></a-text>
        </a-box>
      </a-entity>
    </a-entity>

    <!-- ============================================== -->
    <!-- 5. CRISP CANVAS-BASED THEORY & STATUS HUD      -->
    <!-- ============================================== -->
    <a-entity position="-1.9 1.6 -1.25" rotation="0 35 0">
      <a-box width="1.44" height="1.64" depth="0.03" color="#0f172a"></a-box>
      <a-plane id="theory-mesh" position="0 0 0.018" width="1.4" height="1.6" material="src: #theoryCanvas; shader: flat;"></a-plane>
    </a-entity>

    <!-- ============================================== -->
    <!-- 6. VR RIG WITH NATIVE THUMBSTICK LOCOMOTION    -->
    <!-- ============================================== -->
    <a-entity id="rig" position="0 0 0.35" vr-locomotion>
      <!-- Head / Camera (WASD controls for Desktop) -->
      <a-entity id="camera" camera position="0 1.55 0" look-controls wasd-controls="acceleration: 18">
        <!-- Reticle Cursor for Desktop click -->
        <a-cursor id="cursor" raycaster="objects: .clickable" cursor="fuse: false" color="#38bdf8"></a-cursor>
      </a-entity>

      <!-- VR Left Hand: Laser raycaster + Thumbstick Walk -->
      <a-entity id="leftHand" 
                oculus-touch-controls="hand: left" 
                laser-controls="hand: left" 
                raycaster="objects: .clickable; lineColor: #38bdf8; lineOpacity: 0.8">
      </a-entity>

      <!-- VR Right Hand: Laser raycaster + Thumbstick Snap-Turn -->
      <a-entity id="rightHand" 
                oculus-touch-controls="hand: right" 
                laser-controls="hand: right" 
                raycaster="objects: .clickable; lineColor: #38bdf8; lineOpacity: 0.8">
      </a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
